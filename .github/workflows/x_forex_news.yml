name: X Forex USD News Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  x-forex-news:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install -r requirements.txt

      - name: Run X Forex News Bot
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python x_forex_news.py

      - name: Save sent events
        run: |
          git config user.name "Forex News Bot"
          git config user.email "forex-news-bot@users.noreply.github.com"

          git add sent_events.json

          git diff --cached --quiet || git commit -m "Update sent X news events"

          git push
