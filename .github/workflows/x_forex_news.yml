name: USD High Impact News Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-usd-high-impact-news:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Check Discord Webhook Secret
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "ERROR: DISCORD_WEBHOOK_URL secret is missing."
            exit 1
          else
            echo "SUCCESS: Discord webhook secret found."
          fi

      - name: Run USD High Impact News Bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python x_forex_news.py

      - name: Save sent events
        run: |
          if [ -f sent_events.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add sent_events.json

            if ! git diff --cached --quiet; then
              git commit -m "Update sent USD news events"
              git push
            else
              echo "No new sent events to save."
            fi
          else
            echo "sent_events.json does not exist yet."
          fi
