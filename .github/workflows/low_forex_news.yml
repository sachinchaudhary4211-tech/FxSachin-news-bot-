name: Low Impact Forex News Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  low-forex-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install requests Pillow

      - name: Run Low Impact Forex News Bot
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          python low_forex_news.py

      - name: Save sent low impact events
        run: |
          git config user.name "Forex News Bot"
          git config user.email "actions@github.com"

          if [ -f sent_low_events.json ]; then
            git add sent_low_events.json

            if git diff --cached --quiet; then
              echo "No changes to commit."
            else
              git commit -m "Update sent low impact events"
              git push
            fi
          else
            echo "sent_low_events.json was not created. Skipping save."
          fi
