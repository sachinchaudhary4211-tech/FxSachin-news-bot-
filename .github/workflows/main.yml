name: Forex News Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  forex-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Run Forex News Bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python forex_news.py

      - name: Save sent events
        run: |
          git config user.name "Forex News Bot"
          git config user.email "forex-news-bot@users.noreply.github.com"

          if [ -f sent_events.json ]; then
            git add sent_events.json

            if ! git diff --cached --quiet; then
              git commit -m "Update sent events"
              git push
            else
              echo "No changes to sent events"
            fi
          else
            echo "sent_events.json was not created - skipping save"
          fi
